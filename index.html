<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>České Holky – Portál a databáze profilů</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandCyan: '#00d2ff',
                        brandBlue: '#3a7bd5',
                        brandPurple: '#8A2387',
                        brandPink: '#E94057'
                    },
                    fontFamily: { sans: ['Poppins', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        .hero-header { background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 50%, #8A2387 100%); }
        .profile-card { transition: all 0.3s ease; }
        .profile-card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.12); }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col font-sans">

    <!-- Horní reklamní banner (pro placenou reklamu z administrace) -->
    <div id="ad-banner-slot" class="bg-gray-900 text-white text-center py-2 px-4 text-xs tracking-wider uppercase border-b border-gray-800">
        ✨ Reklama: Získej exkluzivní prémiový přístup! <a href="#" class="underline text-brandCyan ml-2">Zjistit více</a>
    </div>

    <!-- Hlavní hlavička -->
    <header class="hero-header text-white shadow-lg sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="switchTab('home')">
                <div class="bg-white text-brandBlue font-extrabold text-xl px-3 py-1.5 rounded-xl shadow-md tracking-wider">
                    ČESKÉ<br><span class="text-brandPink text-lg">HOLKY</span>
                </div>
            </div>

            <nav class="hidden md:flex items-center space-x-6 text-sm font-semibold">
                <button onclick="switchTab('home')" class="hover:text-brandCyan transition py-2 px-3 rounded-lg hover:bg-white/10">🏠 Úvod</button>
                <button onclick="switchTab('profiles')" class="hover:text-brandCyan transition py-2 px-3 rounded-lg hover:bg-white/10">👥 Profily</button>
                <button onclick="switchTab('articles')" class="hover:text-brandCyan transition py-2 px-3 rounded-lg hover:bg-white/10">📑 Články & Ocenění</button>
                <button onclick="switchTab('guestbook')" class="hover:text-brandCyan transition py-2 px-3 rounded-lg hover:bg-white/10">✍️ Kniha návštěv</button>
            </nav>

            <div class="flex items-center space-x-3">
                <a href="admin.html" class="bg-white/20 hover:bg-white/30 text-white px-4 py-2 rounded-full text-xs font-semibold tracking-wider transition border border-white/30 flex items-center space-x-1">
                    <span>⚙️ Admin PWA</span>
                </a>
                <div class="hidden lg:flex items-center bg-black/20 px-3 py-1.5 rounded-full text-xs text-white/90">
                    <span>👁️ Zobrazení: <strong id="visitor-counter">142,850</strong></span>
                </div>
            </div>
        </div>
    </header>

    <!-- Hlavní obsah -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">

        <!-- TAB: ÚVOD -->
        <div id="tab-home" class="tab-content">
            <div class="flex flex-wrap items-center justify-between gap-4 mb-8 bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                <div class="flex items-center space-x-2">
                    <span class="bg-brandCyan text-white px-4 py-2 rounded-full text-xs font-bold shadow">Filtry</span>
                    <select id="filter-hair" onchange="renderProfiles()" class="bg-gray-100 text-sm px-3 py-2 rounded-xl border-0 focus:ring-2 focus:ring-brandBlue">
                        <option value="">Všechny barvy vlasů</option>
                        <option value="blonde">Blond</option>
                        <option value="brunette">Brunetka</option>
                        <option value="redhead">Zrzka</option>
                    </select>
                </div>
                <div class="w-full sm:w-72">
                    <input type="text" id="search-input" oninput="renderProfiles()" placeholder="Hledat podle jména..." class="w-full px-4 py-2 rounded-xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-brandBlue">
                </div>
            </div>

            <div id="profiles-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                <!-- Generováno JS -->
            </div>
        </div>

        <!-- TAB: PROFILY -->
        <div id="tab-profiles" class="tab-content hidden">
            <h2 class="text-2xl font-bold mb-6 text-gray-900">Kompletní databáze profilů</h2>
            <div id="profiles-full-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
        </div>

        <!-- TAB: ČLÁNKY -->
        <div id="tab-articles" class="tab-content hidden">
            <h2 class="text-2xl font-bold mb-6 text-gray-900">Články, rubriki a ocenění</h2>
            <div id="articles-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
        </div>

        <!-- TAB: KNIHA NÁVŠTĚV -->
        <div id="tab-guestbook" class="tab-content hidden">
            <div class="max-w-2xl mx-auto bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <h2 class="text-2xl font-bold mb-4 text-gray-900">Kniha návštěv</h2>
                <form id="guestbook-form" onsubmit="addGuestbookEntry(event)" class="space-y-4 mb-8">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Vaše jméno</label>
                        <input type="text" id="gb-name" required class="w-full px-4 py-2 rounded-xl border text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Vzkaz</label>
                        <textarea id="gb-message" rows="3" required class="w-full px-4 py-2 rounded-xl border text-sm"></textarea>
                    </div>
                    <button type="submit" class="w-full bg-gradient-to-r from-brandBlue to-brandPurple text-white py-2.5 rounded-xl font-semibold text-sm shadow">Odeslat vzkaz</button>
                </form>
                <div id="guestbook-list" class="space-y-4"></div>
            </div>
        </div>

    </main>

    <!-- Modální detail profilu -->
    <div id="profile-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-lg w-full p-6 relative shadow-2xl">
            <button onclick="closeModal()" class="absolute top-4 right-4 bg-gray-100 w-9 h-9 rounded-full font-bold">✕</button>
            <div id="modal-content"></div>
        </div>
    </div>

    <footer class="bg-white border-t py-6 mt-12 text-center text-xs text-gray-500">
        ČESKÉ HOLKY • Všechna práva vyhrazena © 2026
    </footer>

    <script>
        let profiles = JSON.parse(localStorage.getItem('ch_profiles')) || [
            { id: 1, name: "ZAMBLI", age: 29, height: "160 cm", measurements: "90-60-90", hair: "brunette", image: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=500&q=80", bio: "Populární česká herečka a modelka s množstvím ocenění." },
            { id: 2, name: "DOLVE", age: 29, height: "175 cm", measurements: "88-58-88", hair: "blonde", image: "https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=500&q=80", bio: "Známá tvář evropské produkce, držitelka ceny za nejlepší debut." }
        ];
        let articles = JSON.parse(localStorage.getItem('ch_articles')) || [
            { title: "Historie české adult produkce", date: "1. 11. 2026", perex: "Jak se česká tvář prosadila na světové scéně." }
        ];
        let guestbook = JSON.parse(localStorage.getItem('ch_guestbook')) || [
            { name: "Petr", message: "Skvělý portál!", date: "7. 11. 2026" }
        ];
        let adCode = localStorage.getItem('ch_adcode') || '';

        document.addEventListener('DOMContentLoaded', () => {
            renderProfiles();
            renderArticles();
            renderGuestbook();
            if(adCode) document.getElementById('ad-banner-slot').innerHTML = adCode;
            document.getElementById('visitor-counter').innerText = (142850 + Math.floor(Math.random() * 100)).toLocaleString();
        });

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById('tab-' + tabId).classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
            if(tabId === 'profiles') renderFullProfiles();
        }

        function renderProfiles() {
            const grid = document.getElementById('profiles-grid');
            const search = document.getElementById('search-input').value.toLowerCase();
            const hair = document.getElementById('filter-hair').value;
            const filtered = profiles.filter(p => p.name.toLowerCase().includes(search) && (hair === '' || p.hair === hair));
            grid.innerHTML = filtered.map(p => cardHtml(p)).join('');
        }

        function renderFullProfiles() {
            document.getElementById('profiles-full-grid').innerHTML = profiles.map(p => cardHtml(p)).join('');
        }

        function cardHtml(p) {
            return `
                <div class="profile-card bg-white rounded-3xl p-4 border shadow-sm flex flex-col items-center">
                    <div class="w-full h-56 rounded-2xl overflow-hidden mb-4 bg-gray-100">
                        <img src="${p.image}" class="w-full h-full object-cover">
                    </div>
                    <h3 class="font-bold text-lg text-gray-900 mb-1">${p.name}</h3>
                    <p class="text-xs text-gray-500 mb-3 text-center">Věk: ${p.age} | Výška: ${p.height} | Míry: ${p.measurements}</p>
                    <button onclick="openDetail(${p.id})" class="mt-auto w-full bg-gradient-to-r from-brandBlue to-brandPurple text-white py-2 rounded-xl text-xs font-semibold shadow">DETAILNÍ PROFIL</button>
                </div>
            `;
        }

        function openDetail(id) {
            const p = profiles.find(x => x.id === id);
            if(!p) return;
            document.getElementById('modal-content').innerHTML = `
                <div class="flex flex-col items-center">
                    <img src="${p.image}" class="w-40 h-40 rounded-2xl object-cover shadow-md mb-4">
                    <h2 class="text-2xl font-extrabold mb-1">${p.name}</h2>
                    <p class="text-xs text-gray-500 mb-4">Věk: ${p.age} | Výška: ${p.height} | Míry: ${p.measurements}</p>
                    <p class="text-sm text-gray-600 text-center mb-6">${p.bio}</p>
                    <button onclick="document.getElementById('profile-modal').classList.add('hidden')" class="w-full bg-gray-900 text-white py-2 rounded-xl text-sm">Zavřít</button>
                </div>
            `;
            document.getElementById('profile-modal').classList.remove('hidden');
        }

        function renderArticles() {
            document.getElementById('articles-grid').innerHTML = articles.map(a => `
                <div class="bg-white p-6 rounded-3xl border shadow-sm">
                    <span class="text-xs font-semibold text-brandPink">${a.date}</span>
                    <h3 class="text-lg font-bold mt-1 mb-2">${a.title}</h3>
                    <p class="text-sm text-gray-600">${a.perex}</p>
                </div>
            `).join('');
        }

        function renderGuestbook() {
            document.getElementById('guestbook-list').innerHTML = guestbook.map(g => `
                <div class="bg-gray-50 p-4 rounded-2xl border">
                    <div class="flex justify-between items-center mb-1"><strong class="text-sm">${g.name}</strong><span class="text-xs text-gray-400">${g.date}</span></div>
                    <p class="text-sm text-gray-600">${g.message}</p>
                </div>
            `).join('');
        }

        function addGuestbookEntry(e) {
            e.preventDefault();
            guestbook.unshift({
                name: document.getElementById('gb-name').value,
                message: document.getElementById('gb-message').value,
                date: new Date().toLocaleDateString('cs-CZ')
            });
            localStorage.setItem('ch_guestbook', JSON.stringify(guestbook));
            document.getElementById('guestbook-form').reset();
            renderGuestbook();
        }
    </script>
</body>
</html>
