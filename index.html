<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- SEO optimalizace -->
    <title>České Holky – Exkluzivní portál a databáze profilů</title>
    <meta name="description" content="Objevte ty nejkrásnější české tváře, detailní biografie, exkluzivní fotogalerie a články ze světa adult produkce.">
    <!-- Google Fonts & Tailwind CSS -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navyDark: '#0b1329',
                        brandBlue: '#0066ff',
                        brandCyan: '#00d2ff',
                        brandPurple: '#8A2387',
                        brandPink: '#E94057'
                    },
                    fontFamily: { sans: ['Poppins', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        * { box-sizing: border-box; }
        body { overflow-x: hidden; }
        .profile-card { transition: all 0.3s ease; }
        .profile-card:hover { transform: translateY(-4px); box-shadow: 0 12px 25px rgba(0,0,0,0.08); }
        .banner-pc { width: 100%; max-height: 340px; object-fit: cover; object-position: center; }
        .banner-mobil { width: 100%; height: auto; object-fit: contain; background-color: #0b1329; display: block; }
        
        .bio-text p {
            margin-bottom: 0.85rem;
            line-height: 1.6;
        }
        .bio-text p:last-child {
            margin-bottom: 0;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col font-sans antialiased">

    <!-- REKLAMNÍ BANNER -->
    <div class="bg-navyDark text-white text-center py-2 px-3 text-[11px] tracking-wider uppercase border-b border-gray-800">
        <span id="ad-banner-slot">✨ Reklama: Získej exkluzivní prémiový přístup! <a href="#" class="underline text-brandCyan ml-2">Zjistit více</a></span>
    </div>

    <!-- HORNÍ NAVIGACE -->
    <header class="bg-navyDark text-white sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-2 cursor-pointer" onclick="switchTab('home')">
                <span class="text-base sm:text-xl font-extrabold tracking-wide text-white">ČESKÉ <span class="text-brandCyan">HOLKY</span></span>
            </div>

            <nav class="flex items-center space-x-1 sm:space-x-3 text-xs sm:text-sm font-medium overflow-x-auto py-2">
                <button onclick="switchTab('home')" id="tab-btn-home" class="px-2.5 py-1.5 rounded-lg transition text-brandCyan font-semibold bg-white/15 whitespace-nowrap">Úvod</button>
                <button onclick="switchTab('profiles')" id="tab-btn-profiles" class="px-2.5 py-1.5 rounded-lg transition hover:bg-white/10 text-gray-300 whitespace-nowrap">Profily</button>
                <button onclick="switchTab('articles')" id="tab-btn-articles" class="px-2.5 py-1.5 rounded-lg transition hover:bg-white/10 text-gray-300 whitespace-nowrap">Články</button>
                <button onclick="switchTab('links')" id="tab-btn-links" class="px-2.5 py-1.5 rounded-lg transition hover:bg-white/10 text-gray-300 whitespace-nowrap">Odkazy</button>
                <button onclick="switchTab('guestbook')" id="tab-btn-guestbook" class="px-2.5 py-1.5 rounded-lg transition hover:bg-white/10 text-gray-300 whitespace-nowrap">Vzkazy</button>
            </nav>
        </div>
    </header>

    <!-- BANNERY -->
    <div class="hidden md:block w-full bg-navyDark shadow-lg overflow-hidden">
        <div class="max-w-7xl mx-auto flex justify-center">
            <img src="banner-pc.jpg" alt="Desktop Banner" class="banner-pc">
        </div>
    </div>
    <div class="block md:hidden w-full bg-navyDark shadow-md overflow-hidden">
        <img src="banner-mobil.jpg" alt="Mobil Banner" class="banner-mobil">
    </div>

    <!-- HLAVNÍ OBSAH -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-3 sm:px-6 lg:px-8 py-5">

        <!-- TAB: ÚVOD -->
        <div id="tab-home" class="tab-content">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 mb-6">
                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-3">
                    <div>
                        <label class="block text-[11px] font-semibold text-gray-500 mb-1">Hledat (jméno nebo text v biu)</label>
                        <input type="text" id="search-input" oninput="filterAndRenderProfiles()" placeholder="Klíčové slovo..." class="w-full px-3 py-2 rounded-xl border border-gray-200 text-xs focus:ring-2 focus:ring-brandBlue bg-gray-50/50">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-gray-500 mb-1">Barva vlasů</label>
                        <select id="filter-hair" onchange="filterAndRenderProfiles()" class="w-full px-3 py-2 rounded-xl border border-gray-200 text-xs bg-gray-50/50">
                            <option value="">Všechny barvy</option>
                            <option value="blonde">Blond</option>
                            <option value="brunette">Brunetka</option>
                            <option value="redhead">Zrzka</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-gray-500 mb-1">Věk</label>
                        <select id="filter-age" onchange="filterAndRenderProfiles()" class="w-full px-3 py-2 rounded-xl border border-gray-200 text-xs bg-gray-50/50">
                            <option value="">Všechny věky</option>
                            <option value="18-22">18–22 let</option>
                            <option value="23-26">23–26 let</option>
                            <option value="27-30">27–30 let</option>
                            <option value="31+">31+ let</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-gray-500 mb-1">Lokalita</label>
                        <select id="filter-location" onchange="filterAndRenderProfiles()" class="w-full px-3 py-2 rounded-xl border border-gray-200 text-xs bg-gray-50/50">
                            <option value="">Všechny lokality</option>
                            <option value="Praha">Praha</option>
                            <option value="Brno">Brno</option>
                            <option value="Ostrava">Ostrava</option>
                            <option value="Zlín">Zlín</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-gray-500 mb-1">Řazení</label>
                        <select id="filter-sort" onchange="filterAndRenderProfiles()" class="w-full px-3 py-2 rounded-xl border border-gray-200 text-xs bg-gray-50/50">
                            <option value="newest">Od nejnovějších</option>
                            <option value="name">Abecedně (A-Z)</option>
                            <option value="age-asc">Od nejmladších</option>
                        </select>
                    </div>
                </div>
            </div>

            <div id="profiles-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
        </div>

        <!-- TAB: PROFILY -->
        <div id="tab-profiles" class="tab-content hidden">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg sm:text-xl font-bold text-gray-900">Kompletní databáze profilů</h2>
                <span id="profiles-count" class="text-xs font-semibold bg-gray-200 text-gray-700 px-3 py-1 rounded-full">0 profilů</span>
            </div>
            <div id="profiles-full-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
        </div>

        <!-- TAB: ČLÁNKY -->
        <div id="tab-articles" class="tab-content hidden">
            <h2 class="text-lg sm:text-xl font-bold text-gray-900 mb-4">Články a ocenění</h2>
            <div id="articles-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </div>

        <!-- TAB: ODKAZY -->
        <div id="tab-links" class="tab-content hidden">
            <h2 class="text-lg sm:text-xl font-bold text-gray-900 mb-4">Doporučené odkazy a partnerské weby</h2>
            <div id="links-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6"></div>
        </div>

        <!-- TAB: KNIHA NÁVŠTĚV -->
        <div id="tab-guestbook" class="tab-content hidden">
            <div class="max-w-xl mx-auto bg-white p-5 sm:p-6 rounded-3xl shadow-sm border border-gray-100">
                <h2 class="text-lg sm:text-xl font-bold text-gray-900 mb-3">Kniha návštěv</h2>
                <form id="guestbook-form" onsubmit="addGuestbookEntry(event)" class="space-y-3 mb-5">
                    <input type="text" id="gb-name" placeholder="Vaše jméno" required class="w-full px-3.5 py-2 rounded-xl border text-xs">
                    <textarea id="gb-message" rows="3" placeholder="Váš vzkaz..." required class="w-full px-3.5 py-2 rounded-xl border text-xs"></textarea>
                    <button type="submit" class="w-full bg-navyDark text-white py-2.5 rounded-xl font-semibold text-xs">Odeslat vzkaz</button>
                </form>
                <div id="guestbook-list" class="space-y-3"></div>
            </div>
        </div>

    </main>

    <!-- MODAL DETAIL -->
    <div id="profile-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3">
        <div class="bg-white rounded-3xl max-w-xl w-full p-5 relative shadow-2xl overflow-y-auto max-h-[90vh]">
            <button onclick="closeModal()" class="absolute top-4 right-4 bg-gray-100 w-8 h-8 rounded-full flex items-center justify-center font-bold">✕</button>
            <div id="modal-content"></div>
        </div>
    </div>

    <!-- LIGHTBOX -->
    <div id="lightbox-modal" class="fixed inset-0 bg-black/90 z-50 hidden flex items-center justify-center p-2" onclick="closeLightbox()">
        <button class="absolute top-5 right-5 text-white text-3xl font-bold">&times;</button>
        <img id="lightbox-img" src="" class="max-w-full max-h-[90vh] object-contain rounded-xl shadow-2xl">
    </div>

    <!-- PATIČKA -->
    <footer class="bg-white border-t py-6 mt-12 text-center text-xs text-gray-500 space-y-2">
        <p>ČESKÉ HOLKY • Všechna práva vyhrazena © 2026</p>
        <p class="text-[11px] text-gray-400">👁️ Celkem zobrazení webu: <strong id="site-visitor-counter" class="text-brandBlue font-bold">0</strong></p>
    </footer>

    <script>
        let defaultProfiles = [
            { id: 1, name: "ZAMBLI", age: 27, location: "Praha", createdAt: Date.now() - 86400000, profileImage: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=600&q=80", gallery: ["https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=600&q=80", "https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=600&q=80"], hair: "brunette", bio: "Populární česká herečka a modelka s množstvím ocenění." }
        ];

        let defaultArticles = [
            { title: "Historie a vývoj české adult produkce", date: "1. 11. 2026", content: "Jak se české herečky prosadily na světové scéně." }
        ];

        let defaultLinks = [
            { title: "Partnerský web", url: "https://example.com", banner: "https://images.unsplash.com/photo-1579546929518-9e396f3cc809?auto=format&fit=crop&w=600&q=80", description: "Navštivte naše partnerské stránky plné skvělého obsahu." }
        ];

        let defaultGuestbook = [
            { name: "Petr", message: "Skvělý portál!", date: "7. 11. 2026" }
        ];

        let profiles = JSON.parse(localStorage.getItem('ch_profiles')) || defaultProfiles;
        let articles = JSON.parse(localStorage.getItem('ch_articles')) || defaultArticles;
        let externalLinks = JSON.parse(localStorage.getItem('ch_links')) || defaultLinks;
        let guestbook = JSON.parse(localStorage.getItem('ch_guestbook')) || defaultGuestbook;
        let favorites = JSON.parse(localStorage.getItem('ch_favorites')) || [];
        let adCode = localStorage.getItem('ch_adcode') || '';

        document.addEventListener('DOMContentLoaded', () => {
            let views = parseInt(localStorage.getItem('ch_site_views') || '0');
            views++;
            localStorage.setItem('ch_site_views', views);
            document.getElementById('site-visitor-counter').innerText = views.toLocaleString();

            const urlParams = new URLSearchParams(window.location.search);
            const profileId = urlParams.get('profile');
            if (profileId) {
                openDetail(parseInt(profileId));
            }

            filterAndRenderProfiles();
            renderArticles();
            renderLinks();
            renderGuestbook();
            if(adCode) document.getElementById('ad-banner-slot').innerHTML = adCode;
        });

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById('tab-' + tabId).classList.remove('hidden');
            
            ['home', 'profiles', 'articles', 'links', 'guestbook'].forEach(t => {
                const btn = document.getElementById('tab-btn-' + t);
                if(btn) {
                    if(t === tabId) {
                        btn.className = "px-2.5 py-1.5 rounded-lg transition text-brandCyan font-semibold bg-white/15 whitespace-nowrap";
                    } else {
                        btn.className = "px-2.5 py-1.5 rounded-lg transition hover:bg-white/10 text-gray-300 whitespace-nowrap";
                    }
                }
            });

            window.scrollTo({ top: 0, behavior: 'smooth' });
            if(tabId === 'profiles') renderFullProfiles();
        }

        // ROZŠÍŘENÉ VYHLEDÁVÁNÍ (Hledá jak ve jménu, tak v textu v biu)
        function filterAndRenderProfiles() {
            const search = document.getElementById('search-input').value.toLowerCase().trim();
            const hair = document.getElementById('filter-hair').value;
            const ageGroup = document.getElementById('filter-age').value;
            const location = document.getElementById('filter-location').value;
            const sortBy = document.getElementById('filter-sort').value;

            let filtered = profiles.filter(p => {
                const nameMatch = p.name ? p.name.toLowerCase().includes(search) : false;
                const bioMatch = p.bio ? p.bio.toLowerCase().includes(search) : false;
                const matchSearch = search === '' || nameMatch || bioMatch;

                const matchHair = !hair || p.hair === hair;
                const matchLoc = !location || (p.location && p.location.toLowerCase() === location.toLowerCase());
                
                let matchAge = true;
                if (ageGroup === '18-22') matchAge = p.age >= 18 && p.age <= 22;
                if (ageGroup === '23-26') matchAge = p.age >= 23 && p.age <= 26;
                if (ageGroup === '27-30') matchAge = p.age >= 27 && p.age <= 30;
                if (ageGroup === '31+') matchAge = p.age >= 31;

                return matchSearch && matchHair && matchLoc && matchAge;
            });

            if (sortBy === 'name') filtered.sort((a, b) => a.name.localeCompare(b.name));
            else if (sortBy === 'age-asc') filtered.sort((a, b) => a.age - b.age);
            else filtered.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

            document.getElementById('profiles-grid').innerHTML = filtered.map(p => createCard(p)).join('');
        }

        function renderFullProfiles() {
            document.getElementById('profiles-full-grid').innerHTML = profiles.map(p => createCard(p)).join('');
            document.getElementById('profiles-count').innerText = profiles.length + ' profilů';
        }

        function createCard(p) {
            const isFav = favorites.includes(p.id);
            const totalPhotos = p.gallery ? p.gallery.length : 0;
            const coverImg = p.profileImage || (p.gallery && p.gallery.length > 0 ? p.gallery[0] : 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=600&q=80');
            const isNew = p.createdAt && (Date.now() - p.createdAt < 7 * 24 * 60 * 60 * 1000);

            return `
                <div class="profile-card bg-white rounded-3xl p-4 border border-gray-100 shadow-sm relative flex flex-col">
                    ${isNew ? '<span class="absolute top-4 left-4 z-10 bg-brandPink text-white text-[10px] font-extrabold px-2.5 py-1 rounded-full shadow">NOVINKA</span>' : ''}
                    <button onclick="toggleFav(${p.id})" class="absolute top-5 right-5 z-10 bg-white/90 p-2 rounded-full shadow hover:scale-110 transition">
                        ${isFav ? '❤️' : '🤍'}
                    </button>
                    <div class="w-full h-60 rounded-2xl overflow-hidden mb-3 bg-gray-100 cursor-pointer" onclick="openDetail(${p.id})">
                        <img src="${coverImg}" class="w-full h-full object-cover">
                    </div>
                    <h3 class="font-bold text-base text-gray-900 mb-1">${p.name}</h3>
                    <p class="text-[11px] text-gray-500 mb-3">📍 ${p.location || 'ČR'} | 🎂 ${p.age} let | 📷 ${totalPhotos} fotek v galerii</p>
                    <button onclick="openDetail(${p.id})" class="mt-auto w-full bg-navyDark text-white py-2.5 rounded-xl text-xs font-semibold shadow">Zobrazit profil</button>
                </div>
            `;
        }

        function toggleFav(id) {
            if(favorites.includes(id)) favorites = favorites.filter(f => f !== id);
            else favorites.push(id);
            localStorage.setItem('ch_favorites', JSON.stringify(favorites));
            filterAndRenderProfiles();
        }

        function openDetail(id) {
            const p = profiles.find(x => x.id === id);
            if(!p) return;
            const galleryArray = p.gallery && p.gallery.length > 0 ? p.gallery : [];

            let formattedBio = p.bio ? p.bio.split('\n').map(par => `<p>${par.trim()}</p>`).join('') : '<p>Žádný životopis není k dispozici.</p>';

            document.getElementById('modal-content').innerHTML = `
                <div class="flex flex-col items-center">
                    <h2 class="text-xl font-extrabold mb-1">${p.name}</h2>
                    <p class="text-xs text-gray-500 mb-3">📍 ${p.location || 'ČR'} | 🎂 ${p.age} let | 📷 ${galleryArray.length} fotek v galerii</p>
                    
                    <button onclick="shareProfile(${p.id})" class="mb-4 bg-brandBlue/10 text-brandBlue hover:bg-brandBlue/20 px-3 py-1.5 rounded-xl text-xs font-semibold transition flex items-center space-x-1">
                        <span>🔗 Sdílet tento profil</span>
                    </button>

                    <div class="flex space-x-2 bg-gray-100 p-1 rounded-xl w-full mb-4">
                        <button onclick="switchModalTab('bio')" id="modal-tab-bio" class="flex-1 py-2 text-xs font-bold rounded-lg bg-navyDark text-white transition">📖 Bio</button>
                        <button onclick="switchModalTab('gallery')" id="modal-tab-gallery" class="flex-1 py-2 text-xs font-bold rounded-lg text-gray-600 hover:bg-gray-200 transition">🖼️ Galerie (${galleryArray.length})</button>
                    </div>

                    <div id="modal-content-bio" class="w-full text-xs text-gray-700 leading-relaxed bg-gray-50 p-4 rounded-2xl border mb-4 bio-text max-h-72 overflow-y-auto">
                        ${formattedBio}
                    </div>

                    <div id="modal-content-gallery" class="w-full hidden space-y-3 max-h-72 overflow-y-auto pr-1">
                        ${galleryArray.length === 0 ? '<p class="text-xs text-gray-500 text-center py-4">Žádné fotky v galerii.</p>' : `
                        <div class="grid grid-cols-2 gap-2">
                            ${galleryArray.map(img => `<div class="h-36 rounded-xl overflow-hidden bg-gray-100 shadow-sm cursor-pointer" onclick="openLightbox('${img}')"><img src="${img}" class="w-full h-full object-cover"></div>`).join('')}
                        </div>`}
                    </div>

                    <button onclick="closeModal()" class="w-full bg-navyDark text-white py-2.5 rounded-xl text-xs font-semibold mt-2">Zavřít</button>
                </div>
            `;
            document.getElementById('profile-modal').classList.remove('hidden');
        }

        function shareProfile(id) {
            const shareUrl = window.location.origin + window.location.pathname + '?profile=' + id;
            navigator.clipboard.writeText(shareUrl).then(() => {
                alert('Odkaz na profil byl zkopírován do schránky!');
            }).catch(() => {
                prompt('Zkopírujte tento odkaz:', shareUrl);
            });
        }

        function openLightbox(imgSrc) {
            document.getElementById('lightbox-img').src = imgSrc;
            document.getElementById('lightbox-modal').classList.remove('hidden');
        }

        function closeLightbox() {
            document.getElementById('lightbox-modal').classList.add('hidden');
        }

        function switchModalTab(tab) {
            const bioTab = document.getElementById('modal-content-bio');
            const galleryTab = document.getElementById('modal-content-gallery');
            const btnBio = document.getElementById('modal-tab-bio');
            const btnGallery = document.getElementById('modal-tab-gallery');

            if (tab === 'bio') {
                bioTab.classList.remove('hidden');
                galleryTab.classList.add('hidden');
                btnBio.className = "flex-1 py-2 text-xs font-bold rounded-lg bg-navyDark text-white transition";
                btnGallery.className = "flex-1 py-2 text-xs font-bold rounded-lg text-gray-600 hover:bg-gray-200 transition";
            } else {
                bioTab.classList.add('hidden');
                galleryTab.classList.remove('hidden');
                btnGallery.className = "flex-1 py-2 text-xs font-bold rounded-lg bg-navyDark text-white transition";
                btnBio.className = "flex-1 py-2 text-xs font-bold rounded-lg text-gray-600 hover:bg-gray-200 transition";
            }
        }

        function closeModal() {
            document.getElementById('profile-modal').classList.add('hidden');
        }

        function renderArticles() {
            document.getElementById('articles-grid').innerHTML = articles.map(a => `
                <div class="bg-white p-4 rounded-3xl border border-gray-100 shadow-sm">
                    <span class="text-[10px] font-semibold text-brandCyan bg-navyDark px-2 py-0.5 rounded-full">${a.date}</span>
                    <h3 class="text-sm font-bold mt-2 mb-1">${a.title}</h3>
                    <div class="text-xs text-gray-600 space-y-2 mt-2">${a.content}</div>
                </div>
            `).join('');
        }

        function renderLinks() {
            const grid = document.getElementById('links-grid');
            if(!externalLinks || externalLinks.length === 0) {
                grid.innerHTML = '<p class="text-xs text-gray-500 col-span-full text-center">Zatím žádné odkazy.</p>';
                return;
            }
            grid.innerHTML = externalLinks.map(l => `
                <a href="${l.url}" target="_blank" class="bg-white rounded-3xl p-4 border border-gray-100 shadow-sm hover:shadow-md transition flex flex-col group">
                    <div class="w-full h-40 rounded-2xl overflow-hidden mb-3 bg-gray-100">
                        <img src="${l.banner}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                    </div>
                    <h3 class="font-bold text-base text-gray-900 mb-1 group-hover:text-brandBlue transition">${l.title}</h3>
                    <p class="text-xs text-gray-600 mb-4">${l.description || ''}</p>
                    <span class="mt-auto text-xs font-bold text-brandBlue underline">Navštívit web →</span>
                </a>
            `).join('');
        }

        function renderGuestbook() {
            document.getElementById('guestbook-list').innerHTML = guestbook.map(g => `
                <div class="bg-gray-50 p-3 rounded-2xl border text-xs">
                    <div class="flex justify-between font-bold mb-1"><span>${g.name}</span><span class="text-[10px] text-gray-400">${g.date}</span></div>
                    <p class="text-gray-600">${g.message}</p>
                </div>
            `).join('');
        }

        function addGuestbookEntry(e) {
            e.preventDefault();
            guestbook.unshift({
                name: document.getElementById('gb-name').value,
                message: document.getElementById('gb-message').value,
                date: new Date().toLocaleDateString('cs-CZ')
            });
            localStorage.setItem('ch_guestbook', JSON.stringify(guestbook));
            document.getElementById('guestbook-form').reset();
            renderGuestbook();
            alert('Vzkaz byl odeslán!');
        }
    </script>
</body>
</html>
